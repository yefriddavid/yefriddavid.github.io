version: '3'

tasks:
  build:
    desc: Compile the blockchain demo binary
    cmd: go build -o blockchain-demo .
    sources:
      - "*.go"
    generates:
      - blockchain-demo

  run:
    desc: Run without compiling (go run .)
    cmd: go run .

  start:
    desc: Run the compiled binary (builds first if needed)
    deps: [build]
    cmd: ./blockchain-demo

  clean:
    desc: Remove the compiled binary
    cmd: rm -f blockchain-demo

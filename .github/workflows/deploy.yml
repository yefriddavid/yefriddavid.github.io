name: Build and Deploy

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    environment: github-pages

    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-node@v4
      with:
        node-version: 20

    - run: npm config set legacy-peer-deps true
      shell: bash

    - run: npm install
      shell: bash

    - name: Build React app
      run: npm run build
      env:
        NODE_OPTIONS: "--max-old-space-size=8192"
        VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
        VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
        VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
        VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
        VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
        VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
        VITE_FIREBASE_VAPID_KEY: ${{ secrets.VITE_FIREBASE_VAPID_KEY }}
        VITE_FIREBASE_DATABASE_URL: ${{ secrets.VITE_FIREBASE_DATABASE_URL }}
        VITE_TAXI_API_KEY: ${{ secrets.VITE_TAXI_API_KEY }}
        VITE_TAXI_AUTH_DOMAIN: ${{ secrets.VITE_TAXI_AUTH_DOMAIN }}
        VITE_TAXI_PROJECT_ID: ${{ secrets.VITE_TAXI_PROJECT_ID }}
        VITE_TAXI_STORAGE_BUCKET: ${{ secrets.VITE_TAXI_STORAGE_BUCKET }}
        VITE_TAXI_MESSAGING_SENDER_ID: ${{ secrets.VITE_TAXI_MESSAGING_SENDER_ID }}
        VITE_TAXI_APP_ID: ${{ secrets.VITE_TAXI_APP_ID }}
        VITE_TAXI_DATABASE_URL: ${{ secrets.VITE_TAXI_DATABASE_URL }}
        VITE_DOMOTICA_API_KEY: ${{ secrets.VITE_DOMOTICA_API_KEY }}
        VITE_DOMOTICA_AUTH_DOMAIN: ${{ secrets.VITE_DOMOTICA_AUTH_DOMAIN }}
        VITE_DOMOTICA_PROJECT_ID: ${{ secrets.VITE_DOMOTICA_PROJECT_ID }}
        VITE_DOMOTICA_STORAGE_BUCKET: ${{ secrets.VITE_DOMOTICA_STORAGE_BUCKET }}
        VITE_DOMOTICA_MESSAGING_SENDER_ID: ${{ secrets.VITE_DOMOTICA_MESSAGING_SENDER_ID }}
        VITE_DOMOTICA_APP_ID: ${{ secrets.VITE_DOMOTICA_APP_ID }}
        VITE_DOMOTICA_DATABASE_URL: ${{ secrets.VITE_DOMOTICA_DATABASE_URL }}

    - uses: actions/upload-pages-artifact@v3
      with:
        path: ./build

    - name: Deploy to Firebase Hosting (yefriddavid.web.app)
      if: github.ref == 'refs/heads/main' && github.event_name == 'push'
      continue-on-error: true
      uses: FirebaseExtended/action-hosting-deploy@v0
      with:
        repoToken: '${{ secrets.GITHUB_TOKEN }}'
        firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_CASHFLOW }}'
        projectId: cashflow-9cbbc
        target: yefriddavid
        channelId: live

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v4
      with:
        timeout: 1800000
